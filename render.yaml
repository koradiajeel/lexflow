# Render "Blueprint": describes the LexFlow backend + its PostgreSQL database.
# On render.com: New + -> Blueprint -> pick this repo. Render reads this file and creates both.
# Values marked "sync: false" are secrets: Render asks you to type them in (they are never stored here).
databases:
  - name: lexflow-db
    plan: free
    region: singapore
    databaseName: lexflow
    user: lexflow

services:
  - type: web
    name: lexflow-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Update the database tables first, then start the API on the port Render gives us.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      # Database: filled in automatically from lexflow-db
      - key: DATABASE_HOST
        fromDatabase:
          name: lexflow-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: lexflow-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: lexflow-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: lexflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: lexflow-db
          property: password

      # Signs login tokens: Render creates a long random value
      - key: SECRET_KEY
        generateValue: true

      # The Vercel website address, e.g. https://lexflow.vercel.app (set after deploying Vercel)
      - key: CORS_ORIGINS
        sync: false

      # Documents in Amazon S3
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: lexflow-docs-koradiajeel
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Email (Gmail)
      - key: SMTP_USER
        value: lexflow.company@gmail.com
      - key: EMAIL_FROM
        value: lexflow.company@gmail.com
      - key: SMTP_PASSWORD
        sync: false
