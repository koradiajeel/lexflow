# Builds the frontend and publishes it on GitHub Pages:
#   https://koradiajeel.github.io/lexflow/
# Runs on every push to main that changes the frontend (or this file), or by hand from the Actions tab.
# It's a public demo with no backend yet, so VITE_DEMO_MODE shows only the landing page.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces an older one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /lexflow/
          VITE_DEMO_MODE: "true"

      # GitHub Pages doesn't know React's routes: serve the app for unknown paths too.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
